<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Geist:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#030306;color:#F6F6F6;font-family:Geist,sans-serif;position:relative}
.video{position:absolute;inset:0;background:
 radial-gradient(60% 40% at 0% 55%,rgba(211,24,22,.28),transparent 70%),
 radial-gradient(120% 50% at 50% 100%,rgba(2,82,172,.55),transparent 60%),
 linear-gradient(#030306 45%,#061433 75%,#0a1f4a)}
.dots{position:absolute;left:0;right:0;bottom:0;height:38%;background-image:radial-gradient(rgba(170,200,255,.7) 1px,transparent 1.5px);background-size:14px 11px;mask-image:linear-gradient(transparent,#000 40%)}
.lines{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 119px,rgba(120,160,255,.06) 119px 120px)}
nav{position:absolute;top:36px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono';font-size:13px;letter-spacing:.14em;color:#A6A9AF}
nav b{color:#F6F6F6;font-weight:400}
.portrait{position:absolute;left:50%;top:70px;width:470px;height:600px;transform:translateX(-50%);
 background:radial-gradient(42% 30% at 50% 28%,#1b2233,transparent 70%),radial-gradient(70% 60% at 50% 95%,#0d1220,transparent 72%);
 box-shadow:inset 26px 0 60px -30px rgba(2,82,172,.9),inset -26px 0 60px -30px rgba(211,24,22,.85);border-radius:48% 48% 0 0;mask-image:linear-gradient(#000 70%,transparent)}
h1{position:absolute;left:0;right:0;top:430px;text-align:center;font-family:'Big Shoulders Display';font-weight:800;font-size:250px;line-height:.82;letter-spacing:-.01em;text-transform:uppercase}
h1 span{color:#8994B4}
.typed{position:absolute;left:0;right:0;top:660px;text-align:center;font-size:24px;font-weight:300;color:#A6A9AF}
.typed i{display:inline-block;width:11px;height:26px;background:#D31816;vertical-align:-4px;margin-left:4px}
.tabs{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);display:flex;gap:16px}
.tab{width:250px;padding:18px 20px;border-radius:16px;background:rgba(9,38,89,.28);border:1px solid rgba(137,148,180,.25);backdrop-filter:blur(10px)}
.tab small{font-family:'JetBrains Mono';font-size:12px;color:#8994B4;letter-spacing:.12em}
.tab div{font-size:20px;font-weight:500;margin-top:6px}
.cta{position:absolute;right:56px;top:28px;padding:12px 22px;border-radius:999px;border:1px solid;border-color:#0252AC #D31816 #D31816 #0252AC;font-size:14px}
</style></head><body>
<div class="video"></div><div class="lines"></div><div class="dots"></div>
<nav><b>JON MASROPIAN</b><span>SOFTWARE ENGINEER · TEXAS</span><span></span></nav>
<a class="cta">Email me</a>
<div class="portrait"></div>
<h1>Jon <span>Masropian</span></h1>
<p class="typed">I write software. 22 years in Army networks taught me how it breaks.<i></i></p>
<div class="tabs">
 <div class="tab"><small>01 / PROJECTS</small><div>What I've built</div></div>
 <div class="tab"><small>02 / BIOGRAPHY</small><div>Army to software</div></div>
 <div class="tab"><small>03 / CYBER LAB</small><div>Live terminal</div></div>
 <div class="tab"><small>04 / CONTACT</small><div>Send a message</div></div>
</div>
</body></html>
